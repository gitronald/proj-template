name: test

on:
  push:
    branches: [main, dev]
    paths-ignore: ["*.md", "docs/**", ".planners/**", ".claude/**"]
  pull_request:
    paths-ignore: ["*.md", "docs/**", ".planners/**", ".claude/**"]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # Use the uv.lock shellcheck, not the runner's, so CI matches local runs
      - run: uv sync --locked
      - name: shellcheck
        run: git ls-files -co --exclude-standard -- '*.sh' | xargs uv run shellcheck

  # The repotemplates CLI: lint, type check, tests, and a built wheel that ships template/
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The manifest test regenerates the manifest from every release tag
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyrefly check
      - run: uv run pytest
      - name: wheel ships every tracked template file
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          diff <(git ls-files template | sed 's|^template/||' | sort) \
               <(unzip -Z1 "$RUNNER_TEMP"/dist/*.whl | sed -n 's|^repotemplates/template/||p' | sort)

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # /bin/bash is 3.2 on macOS; a Homebrew bash on PATH would hide it
      - name: portability guard
        run: /bin/bash tests/portability.test.sh
      - name: init.sh behavioral tests
        run: /bin/bash tests/init.test.sh
        env:
          MANIFEST_OUT: ${{ runner.temp }}/manifest-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/manifest-${{ matrix.os }}.txt

  # Linux and macOS must scaffold byte-identical repos, file modes included
  identical:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: manifest-*
          merge-multiple: true
      - name: compare scaffolds
        run: diff manifest-ubuntu-latest.txt manifest-macos-latest.txt
