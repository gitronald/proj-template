name: test

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      # Run the shellcheck pinned in uv.lock rather than the one the runner
      # ships, so CI and a local run agree. It is a static check, so one OS
      # suffices.
      - run: uv sync --locked
      - name: shellcheck
        run: git ls-files -co --exclude-standard -- '*.sh' | xargs uv run shellcheck

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Run under /bin/bash explicitly: on macOS that is bash 3.2, which a
      # Homebrew bash earlier on the runner's PATH would otherwise hide.
      - name: portability guard
        run: /bin/bash tests/portability.test.sh
      - name: proj-init behavioral tests
        run: /bin/bash tests/proj-init.test.sh
        env:
          MANIFEST_OUT: ${{ runner.temp }}/manifest-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: manifest-${{ matrix.os }}
          path: ${{ runner.temp }}/manifest-${{ matrix.os }}.txt

  # The same name and template version must scaffold byte-identical repos on
  # Linux and macOS, file modes included.
  identical:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: manifest-*
          merge-multiple: true
      - name: compare scaffolds
        run: diff manifest-ubuntu-latest.txt manifest-macos-latest.txt
