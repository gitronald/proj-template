# Root actions and dev tooling, plus template/'s pre-commit pins. template/'s uv
# ranges have no lock; each scaffolded repo locks and updates its own.
# Read from the default branch only; dev edits are inert until merged.
version: 2
updates:
  - package-ecosystem: github-actions
    # Reads the root's .github/workflows only: bump template/'s workflow pins by hand
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 5
  - package-ecosystem: pre-commit
    # Only template/ pins a hook repo; the root config holds local hooks alone
    directory: /template
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      pre-commit:
        patterns: ["*"]
    cooldown:
      default-days: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    groups:
      python:
        patterns: ["*"]
    cooldown:
      default-days: 5
      semver-major-days: 14
