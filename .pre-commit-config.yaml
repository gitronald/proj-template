# Keep hooks off the post-merge stage (only planners-index runs there)
default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: planners-validate
        name: validate plan frontmatter
        entry: planners validate
        language: system
        files: ^\.planners/plans/[^/]+/plan\.md$
  - repo: local
    hooks:
      - id: planners-index
        name: 'regenerate plan index after merge'
        entry: planners index .
        language: system
        stages: [post-merge]
        always_run: true
        pass_filenames: false
