[project]
name = "PROJECT__NAME"
version = "0.1.0a0"
description = ""
authors = [
    {name = "gitronald", email = "gitronald@users.noreply.github.com"}
]
requires-python = ">=3.11"
dependencies = [
    "typer",
]
readme = "README.md"

[project.urls]
repository = "https://github.com/gitronald/PROJECT__NAME"

[project.scripts]
PROJECT__NAME = "MODULE__NAME.cli:app"

# Which proj-template release this repo was scaffolded from, stamped by
# proj-init.sh and re-stamped by the install-template skill on upgrade. Inert to
# consumers: build backends translate only [project], so this never reaches the
# wheel or the PyPI metadata. Read it to audit template drift across repos.
[tool.proj-template]
version = "TEMPLATE_VERSION"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only what a PyPI consumer needs. Root-anchored (leading "/") so bare
# filenames don't glob at every depth — this keeps internal plan files
# (.planners/), guides (docs/), the .claude/ holder, tests, and tooling out of
# the published sdist.
#
# Not exhaustive: hatchling force-includes pyproject.toml, PKG-INFO, and
# .gitignore in every sdist regardless of this list, and neither `exclude` nor
# `ignore-vcs` drops them. Wheels are unaffected — they carry only the package
# and .dist-info — so treat anything in this file as sdist-visible and keep
# secrets out of it. Adding a path here does not make it importable; wheel
# contents come from the package dir, not this list.
only-include = [
    "/MODULE__NAME",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyrefly>=1.0.0",
    "pytest>=9.0.3",
    "pytest-cov",
    "ruff>=0.15",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (modern Python idioms)
]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["."]
project-excludes = ["**/__pycache__", "**/.venv"]

# tests/ stays type-checked (imports, undefined names, type mismatches),
# but the implicit-any check is relaxed there so unannotated pytest fixture
# params (e.g. `def test_x(tmp_path):`) don't force annotations.
[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
implicit-any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["MODULE__NAME"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 50
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
